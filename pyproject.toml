[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apeSees"
version = "0.1.0"
description = "A pythonic openseespy wrapper - Ladruño4ever"
readme = "README.md"
authors = [
    {name = "Nicolas Mora Bowen", email = "nmorabowen@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
    "openseespy",
    "pandas",
    "scipy",
]

[project.urls]
"Homepage" = "https://github.com/nmorabowen/apeSees"
"Bug Tracker" = "https://github.com/nmorabowen/apeSees/issues"

[tool.setuptools]
package-dir = {"" = "src"}
# Only the apeSees package. src/examples (notebooks and data) is not
# installed; find would otherwise pick it up as a namespace package.
packages = {find = {where = ["src"], include = ["apeSees", "apeSees.*"]}}
